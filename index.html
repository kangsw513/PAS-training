<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PAS트레이닝</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 유튜브 영상을 카드 안에서 반응형(16:9 비율)으로 예쁘게 맞추기 위한 CSS */
  .video-container {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 비율 유지 */
    height: 0;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* 🎠 슬라이더(캐러셀) 구조 스타일 */
  .slider-wrapper {
    position: relative;
    width: 100%;
    padding: 0 40px; /* 화살표 버튼 공간 확보 */
    box-sizing: border-box;
  }

  /* 화살표 버튼 스타일 */
  .slide-btn {
    position: absolute;
    top: 40%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: rgba(139, 69, 19, 0.7);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 10;
    transition: all 0.3s;
  }
  .slide-btn:hover {
    background: #8B4513;
  }
  .slide-btn:disabled {
    background: #ccc;
    cursor: default;
    opacity: 0.4;
  }
  .slide-btn.prev {
    left: -10px;
  }
  .slide-btn.next {
    right: -10px;
  }

  /* 슬라이더 내부 컨테이너 */
  .slider-container {
    width: 100%;
    overflow: hidden;
  }

  /* 슬라이더 내부의 tools 가로 정렬 */
  .tools.slider-inner {
    display: flex !important;
    flex-wrap: nowrap !important;
    gap: 20px !important;
    transition: transform 0.5s ease-in-out;
  }

  /* PC: 가로로 3개씩 고정 */
  .tools.slider-inner .tool-card {
    flex: 0 0 calc((100% - 40px) / 3) !important;
    box-sizing: border-box;
  }

  /* 모바일: 1개씩 꽉 차게 변경 */
  @media (max-width: 768px) {
    .slider-wrapper {
      padding: 0 30px; /* 모바일에서 화살표 공간 재조정 */
    }
    .tools.slider-inner .tool-card {
      flex: 0 0 100% !important;
    }
    .slide-btn.prev { left: -15px; }
    .slide-btn.next { right: -15px; }
  }
</style>
</head>
<body>

<main class="container">

<header class="hero">
  <h1>PAS트레이닝</h1>
  <p>필요한 교육 도구를 카테고리별로 선택해 사용하세요.</p>
</header>

<!-- =========================
     SHORTS (슬라이더 적용)
========================= -->

<div class="category-head">
<div class="category-title">
<span class="category-icon">📱</span>
<h2>SHORTS</h2>
</div>
<div class="category-actions">
<span class="count">6개 영상</span>
<button class="close-btn" onclick="toggleCategory(this)">닫기</button>
</div>
</div>

<!-- 🎠 슬라이더 감싸는 영역 시작 -->
<div class="slider-wrapper">

  <button class="slide-btn prev" id="shorts-prev-btn" disabled>&#10094;</button>
