<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PAS트레이닝</title>

<style>
  /* 유튜브 영상 16:9 반응형 비율 유지 */
  .video-container {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* 🎠 슬라이더 전체를 감싸는 바깥 박스 (화살표 버튼 정렬 공간) */
  .slider-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  /* 둥근 화살표 버튼 스타일 */
  .slide-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
    background: rgba(139, 69, 19, 0.85); /* 커피 브라운 컬러 */
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 10;
    transition: background 0.2s, transform 0.2s;
  }
  .slide-btn:hover {
    background: #a0522d;
    transform: translateY(-50%) scale(1.05);
  }
  .slide-btn:active {
    transform: translateY(-50%) scale(0.95);
  }
  .slide-btn.prev {
    left: -15px;
  }
  .slide-btn.next {
    right: -15px;
  }

  /* 가로로 부드럽게 넘겨볼 수 있는 카드 컨테이너 */
  .shorts-slider {
    width: 100%;
    display: flex !important;
    flex-wrap: nowrap !important;
    gap: 20px !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    scroll-behavior: smooth; /* 화살표 클릭 시 스무스하게 이동 */
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 10px 5px 20px 5px !important;
  }

  /* 스크롤바 감추기 (화살표가 생겼으므로 화면을 더 깔끔하게 만들기 위해 숨김 처리) */
  .shorts-slider::-webkit-scrollbar { display: none; }
  .shorts-slider { -ms-overflow-style: none; scrollbar-width: none; }

  /* PC 화면: 한 번에 정확히 3개씩 배치 */
  .shorts-slider .tool-card {
    flex: 0 0 calc((100% - 40px) / 3) !important;
    min-width: calc((100% - 40px) / 3) !important;
    scroll-snap-align: start;
    box-sizing: border-box;
  }
