<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PAS트레이닝</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 유튜브 영상을 카드 안에서 반응형(16:9 비율)으로 예쁘게 맞추기 위한 CSS */
  .video-container {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 비율 유지 */
    height: 0;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* 🎠 슬라이더(캐러셀) 구조 스타일 */
  .slider-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  /* 화살표 버튼 스타일 */
  .slide-btn {
    position: absolute;
    top: 40%; /* 버튼 위치를 살짝 위로 조정 */
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: rgba(139, 69, 19, 0.8); /* 반투명 커피색 */
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    z-index: 10;
    transition: all 0.3s;
  }
  .slide-btn:hover {
    background: #8B4513; /* 호버 시 진하게 */
  }
  .slide-btn:disabled {
    background: #ccc;
    cursor: default;
    opacity: 0.5;
  }
  .slide-btn.prev {
    left: -20px;
  }
  .slide-btn.next {
    right: -20px;
  }

  /* 슬라이더 내부 컨테이너 */
  .slider-container {
    width: 100%;
    overflow: hidden;
  }

  /* 슬라이더 내부의 tools 가로 정렬 */
  .tools.slider-inner {
    display: flex !important;
    flex-wrap: nowrap !important;
    gap: 20px !important;
    transition: transform 0.5s ease-in-out;
    padding: 10px 0;
  }

  /* PC: 가로로 3개씩 고정 */
  .tools.slider-inner .tool-card {
    flex: 0 0 calc((100% - 40px) / 3) !important;
    box-sizing: border-box;
  }

  /* 모바일: 1개씩 꽉 차게 변경 */
  @media (max-width: 768px) {
    .tools.slider-inner .tool-card {
      flex: 0 0 100% !important;
    }
    .slide-btn.prev { left: -10px; }
    .slide-btn.next { right: -10px; }
  }
</style>
</head>
<body>

<main class="container">

<header class="hero">
  <h1>PAS트레이닝</h1>
  <p>필요한 교육 도구를 카테고리별로 선택해 사용하세요.</p>
</header>
