<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PAS트레이닝</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 유튜브 비디오 16:9 비율 유지 */
  .video-container {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* 화살표와 슬라이더를 묶는 컨테이너 */
  .slider-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  /* 화살표 버튼 */
  .slide-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    background: #8B4513;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 20;
    transition: background 0.2s, transform 0.2s;
  }
  .slide-btn:hover {
    background: #a0522d;
    transform: translateY(-50%) scale(1.08);
  }
  .slide-btn.prev {
    left: -15px;
  }
  .slide-btn.next {
    right: -15px;
  }

  /* 가로 슬라이더 */
  .shorts-slider {
    width: 100%;
    display: flex !important;
    flex-wrap: nowrap !important;
    gap: 20px !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 10px 5px 20px 5px !important;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .shorts-slider::-webkit-scrollbar {
    display: none;
  }

  /* PC 화면: 한 줄에 정확히 3개씩 배치 */
  .shorts-slider .tool-card {
    flex: 0 0 calc((100% - 40px) / 3) !important;
    min-width: calc((100% - 40px) / 3) !important;
    scroll-snap-align: start;
    box-sizing: border-box;
  }

  /* 모바일 화면: 한 줄에 1개씩 큼직하게 배치 */
  @media (max-width: 768px) {
    .shorts-slider .tool-card {
      flex: 0 0 88% !important;
      min-width: 88% !important;
    }
    .slide-btn.prev { left: -5px; }
    .slide-btn.next { right: -5px; }
  }
</style>
</head>
